[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-dynamic-corridor-env"
version = "0.1.0"
description = "OpenEnv SUMO environment for emergency-vehicle dynamic corridor clearing"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "huggingface-hub>=0.24.0",
    "traci>=1.14.0",
    "sumolib>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
training = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
server = "dynamic_corridor_env.server.app:main"
baseline-disaster = "dynamic_corridor_env.baseline:main"
evaluate-disaster = "dynamic_corridor_env.evaluate:main"

[tool.setuptools]
include-package-data = true
packages = ["dynamic_corridor_env", "dynamic_corridor_env.server"]
package-dir = { "dynamic_corridor_env" = ".", "dynamic_corridor_env.server" = "server" }

[tool.setuptools.package-data]
dynamic_corridor_env = ["nets/pune-5/*.xml", "nets/pune-5/*.sumocfg"]
